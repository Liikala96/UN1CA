name: Build

on:
  workflow_dispatch:
    inputs:
      device_target:
        description: 'Válaszd ki a célhardvert (Device Target)'
        required: true
        default: 'o1s'
        type: choice
        options:
          - 'o1s'
          - 'a52sxq'
          - 'a53x'
          - 'a73xq'
          - 'b0q'
          - 'g0q'
          - 'm52xq'
          - 'p3s'
          - 'r0q'
          - 'r9s'
          - 't2s'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8 || true
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          TARGET_DEVICE="${{ github.event.inputs.device_target || 'o1s' }}"
          source ./buildenv.sh $TARGET_DEVICE
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        run: |
          TARGET_DEVICE="${{ github.event.inputs.device_target || 'o1s' }}"
          source ./buildenv.sh $TARGET_DEVICE
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          TARGET_DEVICE="${{ github.event.inputs.device_target || 'o1s' }}"
          source ./buildenv.sh $TARGET_DEVICE
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          TARGET_DEVICE="${{ github.event.inputs.device_target || 'o1s' }}"
          source ./buildenv.sh $TARGET_DEVICE
          ./scripts/make_rom.sh

      - name: Upload Debug Artifacts (framework.jar & services.jar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-and-services-jar-${{ github.event.inputs.device_target || 'o1s' }}
          path: |
            out/target/${{ github.event.inputs.device_target || 'o1s' }}/apktool/system/framework/framework.jar/
            out/target/${{ github.event.inputs.device_target || 'o1s' }}/system/framework/framework.jar
            out/target/${{ github.event.inputs.device_target || 'o1s' }}/apktool/system/framework/services.jar/
            out/target/${{ github.event.inputs.device_target || 'o1s' }}/system/framework/services.jar
          if-no-files-found: ignore

      - name: Upload Flashable ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-${{ github.event.inputs.device_target || 'o1s' }}-ROM
          path: out/*.zip
          if-no-files-found: error
